name: UOS-Core CI/CD Pipeline with Multi-Node Integration

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TELEGRAM_TOKEN_1: ${{ secrets.TELEGRAM_TOKEN_1 }}
  TELEGRAM_TOKEN_2: ${{ secrets.TELEGRAM_TOKEN_2 }}
  TELEGRAM_TOKEN_3: ${{ secrets.TELEGRAM_TOKEN_3 }}
  TELEGRAM_TOKEN_4: ${{ secrets.TELEGRAM_TOKEN_4 }}
  TELEGRAM_TOKEN_5: ${{ secrets.TELEGRAM_TOKEN_5 }}
  TELEGRAM_TOKEN_6: ${{ secrets.TELEGRAM_TOKEN_6 }}

jobs:
  syntax-check:
    name: Python Syntax Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: ✅ Check Python syntax
        run: |
          python -m py_compile initialize_project.py
          python -m py_compile task_orchestrator.py
          python -m py_compile uos_engine.py
          python -m py_compile bot_manager.py
          echo "✓ All Python files have valid syntax"

  lint:
    name: Code Linting & Validation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black isort
      
      - name: 🔍 Run Pylint
        run: |
          pylint initialize_project.py task_orchestrator.py uos_engine.py bot_manager.py --exit-zero || true
        continue-on-error: true
      
      - name: 🔍 Run Flake8
        run: |
          flake8 initialize_project.py task_orchestrator.py uos_engine.py bot_manager.py --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: 🔐 Run Bandit security checks
        run: |
          bandit initialize_project.py task_orchestrator.py uos_engine.py bot_manager.py -v || true
        continue-on-error: true

  integration-test:
    name: Integration Tests with Multi-Node System
    runs-on: ubuntu-latest
    needs: [syntax-check, lint]
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: 🚀 Test system initialization
        run: |
          python initialize_project.py
          echo "✓ System initialization completed"
      
      - name: 🤖 Test bot manager and node initialization
        run: |
          python bot_manager.py
          echo "✓ Bot manager test completed"
      
      - name: 🚀 Test UOS Engine
        run: |
          python uos_engine.py
          echo "✓ UOS Engine test completed"
      
      - name: 📊 Verify node status
        run: |
          if grep -q "ACTIVE" <<< "$(python bot_manager.py 2>&1)"; then
            echo "✓ All nodes are ACTIVE"
          else
            echo "⚠ Node status check completed"
          fi

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [syntax-check, lint, security, integration-test]
    if: always()
    
    steps:
      - name: 📋 UOS-Core CI Pipeline Status
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║        UOS-Core Multi-Node CI Pipeline - Summary            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "✓ Syntax Validation: ${{ needs.syntax-check.result }}"
          echo "✓ Linting & Validation: ${{ needs.lint.result }}"
          echo "✓ Security Checks: ${{ needs.security.result }}"
          echo "✓ Integration Tests: ${{ needs.integration-test.result }}"
          echo ""
          echo "📦 Build Status: COMPLETED"
          echo ""
          echo "🎯 Multi-Node System Status:"
          echo "  • 6x Telegram Bot Nodes"
          echo "  • 1x Gemini API Node"
          echo "  • UOS Engine Central Orchestration"
          echo ""
          echo "🎉 UOS-Core is ready for deployment!"
