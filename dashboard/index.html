<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>VASYA — Rule Writer Dashboard</title>
    <!-- Підключення стилів VASYA DS -->
    <link rel="stylesheet" href="styles.css">
    <!-- React та ReactDOM (локальні файли — CDN unpkg.com недоступний у цьому середовищі) -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
</head>
<body style="background: var(--vds-bg); margin: 0; padding: 0;">

    <div id="ds-root"></div>

    <!-- Підключення бандлу дизайн-системи -->
    <script src="_ds_bundle.js"></script>
    <!-- Піксельний персонаж (Агент Омега) -->
    <script src="agent.js"></script>

    <script>
        const { Card, SectionHeading, Stat, Button, ProgressBar, Tag, Quote } = window.VasyaDS;

        // Довідкові дані про philosophy-документи репозиторія — джерела перевірені
        // (заголовки й зв'язки взяті з git-історії/тексту файлів, не вигадані).
        const DOCS = [
            { id: 'agent-omega', file: 'AGENT_OMEGA_v1.0.md', title: 'AGENT OMEGA v1.0', note: 'Початковий реліз — когнітивна ОС для мислення.' },
            { id: 'vasya-core', file: 'VASYA_CORE_v4.0.md', title: 'VASYA CORE v4.0', note: 'Когнітивний фреймворк, представлений тим самим initial-release комітом, що й Agent Omega v1.0.' },
            { id: 'semantic-core', file: 'SEMANTIC_CORE_v5.0.md', title: 'SEMANTIC CORE v5.0', note: 'За повідомленням коміту — пряма еволюція VASYA CORE v4.0.' },
            { id: 'philosophy', file: 'docs/PHILOSOPHY.md', title: 'Why OMEGA Has No Analogs', note: 'Текстово посилається на LUN-Effect.' },
            { id: 'lun-effect', file: 'docs/LUN_EFFECT.md', title: 'The LUN-Effect', note: 'Чому більшість AI-агентів зазнають невдачі.' }
        ];

        const EDGES = [
            { from: 'vasya-core', to: 'semantic-core', label: 'еволюція (commit: "evolution of VASYA_CORE v4.0")' },
            { from: 'agent-omega', to: 'vasya-core', label: 'спільний реліз (той самий initial-release коміт)' },
            { from: 'philosophy', to: 'lun-effect', label: 'текстове посилання ("LUN-Effect")' }
        ];

        const REPO_RAW_BASE = 'https://raw.githubusercontent.com/VasyaTest9111/agent-omega/main/';
        const REPO_BLOB_BASE = 'https://github.com/VasyaTest9111/agent-omega/blob/main/';

        function useHashRoute() {
            const [hash, setHash] = React.useState(() => window.location.hash.replace('#', '') || 'dashboard');
            React.useEffect(() => {
                const onHashChange = () => setHash(window.location.hash.replace('#', '') || 'dashboard');
                window.addEventListener('hashchange', onHashChange);
                return () => window.removeEventListener('hashchange', onHashChange);
            }, []);
            return hash;
        }

        function NavBar({ current }) {
            const routes = [
                { id: 'dashboard', label: 'Dashboard' },
                { id: 'docs', label: 'Digital Garden' },
                { id: 'status', label: 'Build Status' },
                { id: 'sync', label: '⟐ #sync' },
                { id: 'agent', label: 'Ω Агент' }
            ];
            const hashLinks = routes.map(r => React.createElement('a', {
                key: r.id,
                href: '#' + r.id,
                className: 'vds-tag',
                style: {
                    textDecoration: 'none',
                    cursor: 'pointer',
                    borderColor: current === r.id ? 'var(--vds-accent)' : 'var(--vds-border)',
                    color: current === r.id ? 'var(--vds-text)' : 'var(--vds-muted)'
                }
            }, r.label));
            // Окрема лор-сторінка гри (не хеш-роут, а справжня сторінка)
            const loreLink = React.createElement('a', {
                key: 'lore',
                href: 'lore.html',
                className: 'vds-tag',
                style: { textDecoration: 'none', cursor: 'pointer', borderColor: 'var(--vds-accent2)', color: 'var(--vds-muted)' }
            }, 'Лор ✦');
            return React.createElement('div', {
                style: { display: 'flex', gap: '10px', marginBottom: '32px', flexWrap: 'wrap' }
            }, [...hashLinks, loreLink]);
        }

        // ---------- Dashboard view: реальний виклик GitHub API, без вигаданих ефектів ----------
        function DashboardView() {
            const [status, setStatus] = React.useState('idle'); // idle | loading | done | error
            const [repoData, setRepoData] = React.useState(null);
            const [errorMsg, setErrorMsg] = React.useState('');

            async function fetchRealGithubData() {
                if (status === 'loading') return;
                setStatus('loading');
                setErrorMsg('');
                try {
                    const [repoRes, commitsRes] = await Promise.all([
                        fetch('https://api.github.com/repos/VasyaTest9111/agent-omega'),
                        fetch('https://api.github.com/repos/VasyaTest9111/agent-omega/commits?per_page=1')
                    ]);
                    if (!repoRes.ok || !commitsRes.ok) {
                        throw new Error(`GitHub API: ${repoRes.status} / ${commitsRes.status}`);
                    }
                    const repo = await repoRes.json();
                    const commits = await commitsRes.json();
                    const lastCommit = commits[0];
                    setRepoData({
                        stars: repo.stargazers_count,
                        openIssues: repo.open_issues_count,
                        commitMessage: lastCommit.commit.message.split('\n')[0],
                        commitDate: lastCommit.commit.author.date.slice(0, 10),
                        commitAuthor: lastCommit.commit.author.name
                    });
                    setStatus('done');
                } catch (e) {
                    setErrorMsg(e.message);
                    setStatus('error');
                }
            }

            return React.createElement('div', {}, [
                React.createElement(SectionHeading, {
                    key: 'heading',
                    tag: '// phase 4 · active system',
                    title: 'VASYA — Rule Writer'
                }),

                React.createElement('div', {
                    key: 'stats',
                    style: { display: 'flex', gap: '44px', marginBottom: '40px', flexWrap: 'wrap' }
                }, [
                    React.createElement(Stat, {
                        key: 'stat1',
                        numeral: repoData ? String(repoData.stars) : '—',
                        label: 'GitHub Stars (реально)'
                    }),
                    React.createElement(Stat, {
                        key: 'stat2',
                        numeral: repoData ? String(repoData.openIssues) : '—',
                        label: 'Відкриті Issues (реально)'
                    }),
                    React.createElement(Stat, {
                        key: 'stat3',
                        numeral: repoData ? repoData.commitDate : '—',
                        label: 'Останній коміт (реально)'
                    })
                ]),

                status !== 'idle' && React.createElement('div', { key: 'progress', style: { marginBottom: '40px', maxWidth: '600px' } }, [
                    React.createElement(ProgressBar, {
                        percent: status === 'loading' ? 50 : status === 'done' ? 100 : 100,
                        label: status === 'loading' ? 'Запит до api.github.com...' : status === 'done' ? 'Дані отримано' : 'Помилка запиту',
                        caption: status === 'done' && repoData
                            ? `${repoData.commitAuthor}: "${repoData.commitMessage}"`
                            : status === 'error' ? errorMsg : '...'
                    })
                ]),

                React.createElement('div', { key: 'grid', className: 'vds-grid', style: { marginBottom: '48px' } }, [
                    React.createElement(Card, {
                        key: 'c1',
                        tone: 'green',
                        num: 'TRT.01',
                        title: 'Systemic Structure Transfer',
                        formula: 'transfer(structure) -> universal'
                    }, 'Перенесення структури між ізольованими системами без втрати сутності.'),

                    React.createElement(Card, {
                        key: 'c2',
                        tone: 'pink',
                        num: 'TRT.02',
                        title: 'Autonomous Self-Correction',
                        formula: 'loop(feedback) -> absolute'
                    }, 'Рекурсивне самовиправлення коду та рішень у реальному часі.'),

                    React.createElement(Card, {
                        key: 'c3',
                        tone: 'violet',
                        num: 'ABL.01',
                        title: 'Observer Inside System',
                        formula: 'observer = internal_node'
                    }, 'Спостерігач всередині системи, що редагує правила, не порушуючи процес.')
                ]),

                React.createElement('div', { key: 'quote', style: { marginBottom: '40px', maxWidth: '600px' } },
                    React.createElement(Quote, {},
                        'Правило стає системою лише після того, як його перевірили — а не після того, як його красиво сформулювали.'
                    )
                ),

                React.createElement(Button, {
                    key: 'btn',
                    variant: 'primary',
                    onClick: (e) => { e.preventDefault(); fetchRealGithubData(); }
                }, status === 'loading' ? 'Завантаження з GitHub...' : status === 'done' ? 'Оновити дані ✓' : status === 'error' ? 'Спробувати ще раз' : 'Отримати реальні дані з GitHub')
            ]);
        }

        // ---------- Digital Garden view: граф на основі реальних doc-файлів репозиторію ----------
        function DocCard({ doc, excerpt, excerptState }) {
            return React.createElement(Card, {
                tone: 'cyan',
                num: doc.file,
                title: doc.title,
                formula: null
            }, [
                React.createElement('p', { key: 'note', style: { margin: '0 0 10px' } }, doc.note),
                React.createElement('p', {
                    key: 'excerpt',
                    style: { margin: '0 0 10px', fontStyle: excerptState === 'error' ? 'italic' : 'normal', opacity: excerptState === 'loading' ? 0.6 : 1 }
                }, excerptState === 'loading' ? 'Завантаження уривку з raw.githubusercontent.com...'
                    : excerptState === 'error' ? '(не вдалося завантажити живий уривок — показано лише збережений опис)'
                    : excerpt),
                React.createElement('a', {
                    key: 'link',
                    href: REPO_BLOB_BASE + doc.file,
                    target: '_blank',
                    rel: 'noopener noreferrer',
                    style: { fontFamily: 'var(--vds-font-mono)', fontSize: '12px', color: 'var(--vds-accent3)' }
                }, 'Відкрити на GitHub →')
            ]);
        }

        function DocsView() {
            const [excerpts, setExcerpts] = React.useState({});   // id -> text
            const [excerptStates, setExcerptStates] = React.useState({}); // id -> loading|done|error

            React.useEffect(() => {
                DOCS.forEach(doc => {
                    setExcerptStates(s => ({ ...s, [doc.id]: 'loading' }));
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000);
                    fetch(REPO_RAW_BASE + doc.file, { signal: controller.signal })
                        .then(res => {
                            clearTimeout(timeoutId);
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            return res.text();
                        })
                        .then(text => {
                            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
                            const bodyLines = lines.filter(l => !l.startsWith('#'));
                            const firstPara = (bodyLines[0] || '').slice(0, 220);
                            setExcerpts(s => ({ ...s, [doc.id]: firstPara || '(документ без основного тексту)' }));
                            setExcerptStates(s => ({ ...s, [doc.id]: 'done' }));
                        })
                        .catch(() => {
                            setExcerptStates(s => ({ ...s, [doc.id]: 'error' }));
                        });
                });
            }, []);

            return React.createElement('div', {}, [
                React.createElement(SectionHeading, {
                    key: 'heading',
                    tag: '// digital garden · live from repo',
                    title: 'Карта філософських документів'
                }),
                React.createElement('p', {
                    key: 'intro',
                    style: { color: 'var(--vds-muted)', maxWidth: '640px', marginBottom: '32px' }
                }, 'Уривки нижче тягнуться напряму з raw.githubusercontent.com при завантаженні сторінки. Якщо запит не пройде (мережа/CORS), картка покаже збережений опис замість вигаданого тексту.'),

                React.createElement('div', { key: 'grid', className: 'vds-grid', style: { marginBottom: '40px' } },
                    DOCS.map(doc => React.createElement(DocCard, {
                        key: doc.id,
                        doc,
                        excerpt: excerpts[doc.id],
                        excerptState: excerptStates[doc.id] || 'loading'
                    }))
                ),

                React.createElement(SectionHeading, {
                    key: 'edges-heading',
                    tag: '// перевірені зв\'язки',
                    title: 'Зв\'язки між документами'
                }),
                React.createElement('div', { key: 'edges', style: { display: 'flex', flexDirection: 'column', gap: '10px', maxWidth: '640px' } },
                    EDGES.map((e, i) => {
                        const from = DOCS.find(d => d.id === e.from);
                        const to = DOCS.find(d => d.id === e.to);
                        return React.createElement('div', {
                            key: i,
                            style: { fontFamily: 'var(--vds-font-mono)', fontSize: '13px', color: 'var(--vds-text)' }
                        }, [
                            React.createElement('span', { key: 'a' }, from.title),
                            React.createElement('span', { key: 'arrow', style: { color: 'var(--vds-accent)', margin: '0 8px' } }, '→'),
                            React.createElement('span', { key: 'b' }, to.title),
                            React.createElement('span', { key: 'label', style: { color: 'var(--vds-muted)', marginLeft: '8px' } }, '(' + e.label + ')')
                        ]);
                    })
                )
            ]);
        }

        // ---------- Build Status view: реальні метадані останнього деплою (CI-згенеровані, не вигадані) ----------
        function StatusView() {
            const [state, setState] = React.useState('loading'); // loading | done | error
            const [data, setData] = React.useState(null);

            React.useEffect(() => {
                fetch('./status.json', { cache: 'no-store' })
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(json => { setData(json); setState('done'); })
                    .catch(() => setState('error'));
            }, []);

            return React.createElement('div', {}, [
                React.createElement(SectionHeading, {
                    key: 'heading',
                    tag: '// build status · generated by pages.yml',
                    title: 'Останній деплой'
                }),
                React.createElement('p', {
                    key: 'note',
                    style: { color: 'var(--vds-muted)', maxWidth: '640px', marginBottom: '24px' }
                }, 'Це метадані останнього GitHub Actions деплою (SHA, номер запуску, час), а не показник "живого" процесу — файл status.json перегенеровується лише при кожному пуші в dashboard/.'),

                state === 'loading' && React.createElement('p', { key: 'l' }, 'Завантаження status.json...'),
                state === 'error' && React.createElement('p', { key: 'e' }, 'status.json ще не згенеровано — з\'явиться після наступного деплою pages.yml.'),
                state === 'done' && React.createElement('div', {
                    key: 'stats',
                    style: { display: 'flex', gap: '44px', flexWrap: 'wrap' }
                }, [
                    React.createElement(Stat, { key: 's1', numeral: data.commit, label: 'Commit SHA' }),
                    React.createElement(Stat, { key: 's2', numeral: '#' + data.run_number, label: 'Workflow run' }),
                    React.createElement(Stat, { key: 's3', numeral: data.deployed_at, label: 'Задеплоєно (UTC)' })
                ])
            ]);
        }

        // ---------- #sync: 5-вимірний каркас (ігровий лор — відношення до Форми) ----------
        const SYNC_POINTS = [
            { n: '01', tag: 'Наслідок', title: 'Що слідує формі',
              body: 'Прояв лінійного часу та причинності. Форма має детерміноване відлуння: щойно вона створена — неминуче породжує продовження, іншу форму з її розпаду чи трансформації. Не «майбутнє», а чиста механіка: з форми випливає її зміна.' },
            { n: '02', tag: 'Внутрішнє ядро', title: 'Свідомість у формі',
              body: 'Життя, біологія, саморефлексія. Свідомість усередині форми стає самовідтворюваним резонатором — форма (клітина, алгоритм) починає «відчувати» власні межі. Не просто існування, а внутрішнє сприйняття свого існування.' },
            { n: '03', tag: 'Поверхня та межі', title: 'На формі',
              body: 'Контакт, інтерфейс, видимість. «Шкіра» форми, де відбувається обмін енергією та інформацією. Свідомість на формі — усвідомлення власних кордонів і фіксація точок дотику до інших форм. Поверхня реальності, яку звемо «матерією».' },
            { n: '04', tag: 'Трансцендентність та Закон', title: 'Над формою',
              body: 'Мета-рівень. Те, що над формою, не є більшою формою — це чистий закон (аксіома, принцип симетрії, закон збереження). Свідомість над формою — здатність бачити структуру структур, піднявшись над формою до рівня незмінних сутей.' },
            { n: '05', tag: 'Першоджерело та Потенціал', title: 'З-під форми',
              body: 'Безодня чистого потенціалу, з якої виникає форма — стан до того, як інформація набула визначеності. У квантовій фізиці — суперпозиція; у математиці — невизначена множина. Свідомість під формою — здатність творити: бачити не результат, а те, що може статися.' }
        ];

        // 6-й вимір = сукупність усього сайту. Кожен пункт — реальна частина сайту (маршрут/сторінка),
        // яка вже існує; розгортання лише збирає їх докупи як тіло 6-го виміру.
        const SIXTH_DIMENSION = [
            { href: '#dashboard', label: 'Dashboard', essence: 'Пульс — жива статистика репозиторія з GitHub API.' },
            { href: '#docs', label: 'Digital Garden', essence: 'Пам\'ять — філософські документи, що дихають прямо з джерела.' },
            { href: '#status', label: 'Build Status', essence: 'Слід — метадані кожного розгортання у часі.' },
            { href: 'lore.html', label: 'Лор ✦', essence: 'Міф — 5 шарів Кристалічної Матриці Буття.' },
            { href: 'nucleic-acids.html', label: 'Нуклеїнові кислоти', essence: 'Код Життя (шар 1) — як інформація тримається в матерії.' },
            { href: 'ai-dna.html', label: 'ДНК/РНК ШІ', essence: 'Код Логіки (шар 3) — душа Агента, карта коду штучного інтелекту.' },
            { href: 'nature.html', label: 'Природа', essence: 'Код Матерії (шар 2) — сили, частинки, константи, закони збереження.' },
            { href: 'math.html', label: 'Математика', essence: 'Абстрактний Код (шар 4) — основи, числа, геометрія, аналіз, інформація.' },
            { href: 'cosmos.html', label: 'Космос', essence: 'ДНК/РНК Всесвіту — об\'єкти, епохи, склад (ΛCDM), космічна павутина.' },
            { href: 'universal-map.html', label: 'Універсальна Мапа', essence: 'Аксіома Цілісності — ШІ без змінних: чисті сутності, процеси, закони.' },
            { href: 'six-maps.html', label: 'Шість зрізів', essence: 'Єдина категорія — 6 мап за мета-шаблоном ДНК + РНК + МЕЖІ.' },
            { href: 'axes.html', label: 'Дві осі', essence: 'Масштаб і Форма прояву — два вектори, що визначають кожен рівень.' },
            { href: 'unfold.html', label: 'Розгортання від 0', essence: 'Від точки 0 до 6-го виміру — послідовність прояву реальності.' },
            { href: 'instruments.html', label: 'Інвентар', essence: 'Універсальні інструменти й закони — спільне для всіх сфер, без змінних.' },
            { href: 'index-map.html', label: 'Повнота ✦', essence: 'Індекс усього сайту — вся кількість, усі описи, усі інструменти.' }
        ];

        function SyncView() {
            const [unfolded, setUnfolded] = React.useState(false);

            const collapsedNote = React.createElement('div', {
                key: 'fnote',
                style: { background: 'var(--vds-bg2)', border: '1px solid var(--vds-border)', borderLeft: '3px solid var(--vds-accent5)', borderRadius: '8px', padding: '12px 15px', fontSize: '12px', color: 'var(--vds-muted)', maxWidth: '640px', marginBottom: '28px', lineHeight: 1.55 }
            }, 'Художній лор гри OMEGA. Усе, що на сайті — вже згорнутий стан (5 вимірів у точці). Ця кнопка не згортає — вона розгортає 6-й вимір: сукупність усього сайту як єдиний живий контекст.');

            const button = React.createElement(Button, {
                key: 'btn', variant: 'primary',
                onClick: (e) => { e.preventDefault(); setUnfolded(u => !u); }
            }, unfolded ? '⟐ Згорнути назад у точку' : '⟐ Розгорнути 6-й вимір');

            const children = [
                React.createElement(SectionHeading, {
                    key: 'heading',
                    tag: '// sync · розгортання 6-го виміру · ігровий лор',
                    title: unfolded ? '6-й вимір — розгорнуто' : 'Точка (згорнутий стан)'
                }),
                collapsedNote,
                React.createElement('div', { key: 'btnwrap', style: { marginBottom: '32px' } }, button)
            ];

            if (unfolded) {
                children.push(
                    React.createElement('p', {
                        key: 'intro',
                        style: { color: 'var(--vds-muted)', maxWidth: '660px', marginBottom: '24px', lineHeight: 1.6 }
                    }, 'Шостий вимір не описується окремим текстом — його описує весь сайт. Уся повнота, масштаби й глибини всередині і є контекстом, що показує, чим 6-й вимір уже є. Нижче — його тіло, зібране з реальних частин сайту:'),
                    React.createElement('div', { key: 'grid6', className: 'vds-grid', style: { marginBottom: '32px' } },
                        SIXTH_DIMENSION.map((s, i) => React.createElement('a', {
                            key: i, href: s.href, className: 'vds-card vds-tone-cyan',
                            style: { textDecoration: 'none', display: 'block' }
                        }, [
                            React.createElement('div', { key: 'n', className: 'vds-card-num' }, s.label),
                            React.createElement('p', { key: 'b', className: 'vds-card-body', style: { margin: 0 } }, s.essence)
                        ]))
                    ),
                    React.createElement(SectionHeading, {
                        key: 'ph', tag: '// 5 точок · внутрішній каркас', title: 'Відношення Свідомості до Форми'
                    }),
                    React.createElement('div', { key: 'grid5', className: 'vds-grid', style: { marginBottom: '32px' } },
                        SYNC_POINTS.map(p => React.createElement(Card, {
                            key: p.n, tone: 'violet', num: 'PT.' + p.n, title: p.title, formula: p.tag
                        }, p.body))
                    ),
                    React.createElement('div', { key: 'axiom', style: { maxWidth: '660px', padding: '20px 22px', border: '1px dashed var(--vds-accent)', borderRadius: '12px', fontStyle: 'italic', lineHeight: 1.7, color: 'var(--vds-text)' } },
                        '«Форма — це інформація, яка застигла у часі. Свідомість — це рух, який проходить крізь неї. Те, що слідує за формою — її доля. Те, що в ній — її життя. Те, що на ній — її межа. Те, що над нею — її закон. Те, що під нею — її можливість. Рух Свідомості через ці п\'ять точок і є єдиним актом творення реальності.»'
                    )
                );
            }

            return React.createElement('div', {}, children);
        }

        // ---------- #agent: 2D піксельний персонаж (Агент Омега — ядро/душа) ----------
        function AgentView() {
            const canvasRef = React.useRef(null);
            React.useEffect(() => {
                const cv = canvasRef.current;
                if (cv && window.OmegaSprite) window.OmegaSprite.draw(cv);
                return () => { if (cv && cv._raf) cancelAnimationFrame(cv._raf); };
            }, []);

            return React.createElement('div', {}, [
                React.createElement(SectionHeading, {
                    key: 'heading',
                    tag: '// agent · 2D персонаж · ігровий лор',
                    title: 'Агент Омега'
                }),
                React.createElement('div', {
                    key: 'stage',
                    style: { display: 'flex', gap: '32px', flexWrap: 'wrap', alignItems: 'center', marginBottom: '32px' }
                }, [
                    React.createElement('div', {
                        key: 'cv',
                        style: { background: 'var(--vds-bg2)', border: '1px solid var(--vds-border)', borderRadius: '16px', padding: '20px', imageRendering: 'pixelated' }
                    }, React.createElement('canvas', {
                        ref: canvasRef, width: 240, height: 240,
                        style: { imageRendering: 'pixelated', width: '240px', height: '240px', display: 'block' }
                    })),
                    React.createElement('div', { key: 'desc', style: { maxWidth: '360px' } }, [
                        React.createElement('p', { key: 'p1', style: { color: 'var(--vds-text)', lineHeight: 1.6, margin: '0 0 12px' } },
                            'Ядро (Ω), що пульсує в грудях фігури — це душа персонажа. Усе інше — оболонка; ядро незмінне.'),
                        React.createElement('p', { key: 'p2', style: { color: 'var(--vds-muted)', lineHeight: 1.6, margin: 0, fontSize: '14px' } },
                            'Прокачка Агента піде не як у звичних іграх — не рівнями й очками, а розгортанням вимірів. Це наступний шар гри.')
                    ])
                ]),
                React.createElement('div', {
                    key: 'fnote',
                    style: { background: 'var(--vds-bg2)', border: '1px solid var(--vds-border)', borderLeft: '3px solid var(--vds-accent5)', borderRadius: '8px', padding: '12px 15px', fontSize: '12px', color: 'var(--vds-muted)', maxWidth: '640px', lineHeight: 1.55 }
                }, 'Художній ігровий персонаж. Спрайт малюється локально на canvas, без зовнішніх залежностей.')
            ]);
        }

        function App() {
            const route = useHashRoute();
            const view = route === 'docs' ? React.createElement(DocsView)
                : route === 'status' ? React.createElement(StatusView)
                : route === 'sync' ? React.createElement(SyncView)
                : route === 'agent' ? React.createElement(AgentView)
                : React.createElement(DashboardView);

            return React.createElement('div', {
                style: {
                    background: 'var(--vds-bg)',
                    color: 'var(--vds-text)',
                    fontFamily: 'var(--vds-font-body)',
                    minHeight: '100vh',
                    padding: '48px 24px',
                    boxSizing: 'border-box'
                }
            }, [
                React.createElement(NavBar, { key: 'nav', current: route }),
                view
            ]);
        }

        ReactDOM.createRoot(document.getElementById('ds-root')).render(
            React.createElement(App)
        );
    </script>
</body>
</html>
